{% load static %}
<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14171c">
    <script src="{% static 'portfoy_app/theme.js' %}"></script>
    <title>{% block title %}Hasan Berat Öztürk | Kişisel Portföy{% endblock %}</title>
    <meta name="description"
        content="Hasan Berat Öztürk’ün mobil uygulama, web geliştirme ve görüntü işleme projeleri. Çalışmalarını keşfedin, özgeçmişini inceleyin ve iletişime geçin.">
    <link rel="icon" type="image/svg+xml" href="{% static 'portfoy_app/favicon.svg' %}?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
    <link rel="stylesheet" href="{% static 'portfoy_app/style.css' %}?v=3">
    <script src="{% static 'portfoy_app/navigation.js' %}" defer></script>

</head>

<body>
    <!-- Genel Navbar Yapısı -->
    <nav class="navbar navbar-expand-lg sticky-top bg-body border-bottom py-3" aria-label="Ana Menü">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#giris">
                Hasan Berat<span class="text-primary">.</span>
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto ms-lg-4 order-lg-last">
                <button id="theme-toggle" class="btn btn-outline-theme theme-toggle" type="button"
                    aria-label="Açık temaya geç" title="Açık temaya geç" hidden>
                    <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                    </svg>
                    <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 20.9 13.3Z" />
                    </svg>
                    <span id="theme-toggle-label" class="d-none d-sm-inline">Açık tema</span>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#anaMenu"
                    aria-controls="anaMenu" aria-expanded="false" aria-label="Menüyü aç veya kapat">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="anaMenu">
                <ul class="navbar-nav ms-auto gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="#hakkimda">Hakkımda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#projeler">Projeler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#iletisim">İletişim</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-top py-4">
        <div class="container">
            <small class="text-body-secondary py-3 d-flex align-items-center justify-content-center">
                © {% now "Y" %} Hasan Berat Öztürk
            </small>
        </div>
    </footer>

</body>

</html>
