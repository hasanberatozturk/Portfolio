{% load static %}
<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hasan Berat Öztürk | Kişisel Portföy{% endblock %}</title>
    <meta name="description"
        content="Hasan Berat Öztürk’ün mobil uygulama, web geliştirme ve görüntü işleme projeleri. Çalışmalarını keşfedin, özgeçmişini inceleyin ve iletişime geçin.">
    <link rel="icon" type="image/svg+xml" href="{% static 'portfoy_app/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
    <link rel="stylesheet" href="{% static 'portfoy_app/style.css' %}?v=2">

</head>

<body>
    <!-- Genel Navbar Yapısı -->
    <nav class="navbar navbar-expand-lg sticky-top bg-body border-bottom py-3" aria-label="Ana Menü">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#giris">
                Hasan Berat<span class="text-primary">.</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#anaMenu"
                aria-controls="anaMenu" aria-expanded="false" aria-label="Menüyü aç veya kapat">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="anaMenu">
                <ul class="navbar-nav ms-auto gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="#hakkimda">Hakkımda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#projeler">Projeler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#iletisim">İletişim</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-top py-4">
        <div class="container">
            <small class="text-body-secondary py-3 d-flex align-items-center justify-content-center">
                © {% now "Y" %} Hasan Berat Öztürk
            </small>
        </div>
    </footer>

</body>

</html>
